<section class="testimonial-section">
  <div class="h3-and-span">
    <h3>{{ 'TESTIMONIALS.TITLE' | translate }}</h3>
    <span>{{ 'TESTIMONIALS.SUBTITLE' | translate }}</span>
  </div>
  <div
    class="testimonials-container"
    [attr.aria-label]="'TESTIMONIALS.ARIA' | translate"
    role="region"
    tabindex="0"
  >
    @for (t of testimonials; track t.idT) {
    <div class="testimonial-single">
      <h4>{{ t.nameT }}</h4>
      <span class="project-span">
        {{ 'TESTIMONIALS.PROJECT_PREFIX' | translate }}
        <span>{{ t.projectKey | translate }}</span>
      </span>
      <p>{{ t.textKey | translate }}</p>
    </div>
    } @empty {
    <div class="testimonial-single">
      <p>{{ 'TESTIMONIALS.ARIA' | translate }}</p>
    </div>
    }
  </div>
</section>
