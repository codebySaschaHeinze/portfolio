<section id="works" class="works-section">
  <div class="h3-and-p">
    <h3>{{ 'WORKS.TITLE' | translate }}</h3>
    <p>{{ 'WORKS.INTRO' | translate }}</p>
  </div>

  <div class="works-container">
    @for (project of projects; track project.idP) {
    <div class="works-row" [class.reverse]="$index % 2 === 1">
      <div class="works-left">
        <a
          class="work-card"
          [href]="project.liveLink"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="(project.title | translate) + ' öffnen'"
        >
          <img [src]="project.projectImg" [alt]="project.title | translate" />
        </a>
      </div>

      <div class="works-right">
        <h4>{{ project.title | translate }}</h4>
        <span>{{ project.set.join(' | ') }}</span>
        <p>{{ project.description | translate }}</p>
        <div class="work-actions">
          <a
            class="btn"
            [href]="project.githubLink"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub öffnen"
          >
            <span class="btn-label">{{ 'WORKS.BUTTON_GITHUB' | translate }}</span>
          </a>
          <a
            class="btn alt"
            [href]="project.liveLink"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Live-Demo öffnen"
          >
            <span class="btn-label">{{ 'WORKS.BUTTON_LIVE' | translate }}</span>
          </a>
        </div>
      </div>
    </div>
    }
  </div>

  <img class="big-ellipse ellipse1" src="icons/ellipse-blue-small.webP" alt="" />
  <img class="big-ellipse ellipse2" src="icons/ellipse-blue-small.webP" alt="" />
  <img class="big-ellipse ellipse3" src="icons/ellipse-blue-small.webP" alt="" />
  <img class="big-ellipse ellipse4" src="icons/ellipse-blue-small.webP" alt="" />
  <img class="big-ellipse ellipse5" src="icons/ellipse-blue-small.webP" alt="" />
  <img class="big-ellipse ellipse6" src="icons/ellipse-blue-small.webP" alt="" />
</section>
