<section id="works" class="works-section">
  <div class="h3-and-p">
    <h3>{{ 'WORKS.TITLE' | translate }}</h3>
    <p>{{ 'WORKS.INTRO' | translate }}</p>
  </div>

  <div class="works-container">
    @for (project of projects; track project.idP) {
    <div class="works-row" [class.reverse]="$index % 2 === 1">
      <div class="works-left">
        <a><img [src]="project.projectImg" [alt]="project.title | translate" /></a>
      </div>
      <div class="works-right">
        <h4>{{ project.title | translate }}</h4>
        <span>{{ project.set.join(' | ') }}</span>
        <p>{{ project.description | translate }}</p>
        <div class="work-actions">
          <button type="button" (click)="openExternal(project.githubLink)" class="btn">
            <span class="btn-label">{{ 'WORKS.BUTTON_GITHUB' | translate }}</span>
          </button>

          <button type="button" (click)="openExternal(project.liveLink)" class="btn alt">
            <span class="btn-label">{{ 'WORKS.BUTTON_LIVE' | translate }}</span>
          </button>
        </div>
      </div>
    </div>
    }
  </div>

  <img class="big-ellipse ellipse1" src="icons/ellipse-blue-small.png" alt="" />
  <img class="big-ellipse ellipse2" src="icons/ellipse-blue-small.png" alt="" />
  <img class="big-ellipse ellipse3" src="icons/ellipse-blue-small.png" alt="" />
  <img class="big-ellipse ellipse4" src="icons/ellipse-blue-small.png" alt="" />
  <img class="big-ellipse ellipse5" src="icons/ellipse-blue-small.png" alt="" />
  <img class="big-ellipse ellipse6" src="icons/ellipse-blue-small.png" alt="" />
  <img class="big-ellipse ellipse7" src="icons/ellipse-blue-small.png" alt="" />
</section>
