<section id="works" class="works-section">
  <div class="h3-and-p">
    <h3>Portfolio</h3>
    <p>
      Hier präsentiere ich eine Auswahl meiner Werke – interaktive Projekte zeigen dir meine Skills
      in Aktion.
    </p>
  </div>

  <div class="works-container">
    @for (project of projects; track project.idP) {
    <div class="work-row" [class.reverse]="$index % 2 === 1">
      <div class="works-left">
        <a><img [src]="project.projectImg" [alt]="project.title" /></a>
      </div>
      <div class="works-right">
        <h4>{{ project.title }}</h4>
        <span>{{ project.set.join(' | ') }}</span>
        <p>{{ project.description }}</p>
        <button type="button" (click)="openGithub(project.githubLink)" class="btn">
          <span class="btn-label">{{ project.github || 'GitHub' }}</span>
        </button>
      </div>
    </div>
    }
  </div>

  <img class="big-ellipse ellipse1" src="icons/ellipse-blue.png" alt="" />
  <img class="big-ellipse ellipse2" src="icons/ellipse-blue.png" alt="" />
  <img class="big-ellipse ellipse3" src="icons/ellipse-blue.png" alt="" />
  <img class="big-ellipse ellipse4" src="icons/ellipse-blue.png" alt="" />
  <img class="big-ellipse ellipse5" src="icons/ellipse-blue.png" alt="" />
  <img class="big-ellipse ellipse6" src="icons/ellipse-blue.png" alt="" />
  <img class="big-ellipse ellipse7" src="icons/ellipse-blue.png" alt="" />
</section>
