<section id="contact" class="contact-section">
  <div class="contact-left">
    <h3>Kontakt</h3>
    <h4>Etwas, das gelöst werden will?</h4>
    <p>
      Du hast ein Anliegen oder ein Vorhaben? Kontaktiere mich und wir schauen, ob wir das
      hinbekommen.
    </p>
    <div class="contact-left-contact-me">
      <span>Full-Stack Developer gesucht?</span>
      <span>Kontaktiere mich!</span>
    </div>
  </div>

  <div class="contact-right">
    <input type="text" placeholder="Dein Name" />
    <input type="text" placeholder="Deine Email" />

    <textarea id="msg" name="message" placeholder="Deine Nachricht"></textarea>
    <div class="contact-right-check-box">
      <input type="checkbox" id="contact-check-box" />
      <label for="contact-check-box" class="consent">
        Ich habe die
        <a href="/privacy-policy" target="_blank" rel="noopener">Datenschutzerklärung</a>
        gelesen und stimme der darin beschriebenen Verarbeitung meiner Daten zu.
      </label>
    </div>
    <button>Sag' Hallo</button>
  </div>

  <img class="big-ellipse ellipse1" src="icons/ellipse-blue.png" alt="" />
  <img class="big-ellipse ellipse2" src="icons/ellipse-blue.png" alt="" />
  <img class="big-ellipse ellipse3" src="icons/ellipse-blue.png" alt="" />
</section>
