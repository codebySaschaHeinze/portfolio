<section id="about" class="about-section" aria-labelledby="about-me">
  <img class="big-ellipse" src="icons/ellipse-blue-small.webP" alt="" />

  <img class="small-ellipse" src="icons/ellipse-blue-small.webP" alt="" />

  <div class="about-left">
    <div class="left-together">
      <h3 id="about-me" [innerHTML]="'ABOUT.TITLE' | translate"></h3>
    </div>
    <div class="left-iam">
      <div class="left-iam-iam">
        <h4>{{ 'ABOUT.IAM' | translate }}</h4>
      </div>
      <div class="left-iam-how">
        <div class="left-location-box">
          <div class="image-item img-1" role="img" aria-label=""></div>
          <p>{{ 'ABOUT.LOCATION' | translate }}</p>
        </div>
        <div class="left-remote-box">
          <div class="image-item img-2" role="img" aria-label=""></div>
          <p>{{ 'ABOUT.REMOTE' | translate }}</p>
        </div>
      </div>
    </div>
  </div>

  <div class="about-right">
    <div class="right-about-me">
      <p>{{ 'ABOUT.TEXT1' | translate }}</p>
      <br />
      <p>{{ 'ABOUT.TEXT2' | translate }}</p>
    </div>
    <a class="btn" href="#contact" aria-label="Zum Kontaktbereich">
      <span class="btn-label">{{ 'ABOUT.BUTTON' | translate }}</span>
    </a>
  </div>
</section>
