<div class="atf-background-wrapper">
  <section id="atf" class="atf-section" aria-labelledby="intro-title">
    <img class="atf-ellipse" src="/icons/ellipse-blue.webP" alt="" />
    <div class="atf-left">
      <img class="atf-portrait" src="/imgs/portrait.webP" [alt]="'ATF.PORTRAIT_ALT' | translate" />
    </div>

    <div class="atf-right">
      <div class="atf-text">
        <h1 id="intro-title">
          <span class="atf-lead">{{ 'ATF.HELLO' | translate }}</span>
          <br />
          <span [innerHTML]="'ATF.TITLE' | translate"></span>
        </h1>
      </div>

      <div class="atf-social-buttons" [attr.aria-label]="'ATF.SOCIAL_ARIA' | translate">
        <a href="https://github.com/codebySaschaHeinze" target="_blank" rel="noopener">
          <div
            class="image-item img-1"
            role="img"
            [attr.aria-label]="'ATF.SOCIAL.GITHUB' | translate"
          ></div>
        </a>
        <a href="#contact">
          <div
            class="image-item img-2"
            role="img"
            [attr.aria-label]="'ATF.SOCIAL.CONTACT' | translate"
          ></div>
        </a>
        <a
          href="https://www.linkedin.com/in/sascha-heinze-509a95387/"
          target="_blank"
          rel="noopener"
        >
          <div
            class="image-item img-3"
            role="img"
            [attr.aria-label]="'ATF.SOCIAL.LINKEDIN' | translate"
          ></div>
        </a>
      </div>

      <div class="atf-scroll-and-divider">
        <p>{{ 'ATF.SCROLL' | translate }}</p>
        <div class="divider"></div>
      </div>
    </div>
  </section>
</div>
