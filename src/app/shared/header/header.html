<header class="header-section" [class.hidden]="isOverlayOpen">
  <div class="header-inner">
    <div class="header-left">
      <a class="logo" href="/">
        <img src="icons/logo.png" width="110" height="110" alt="Logo" />
      </a>
    </div>
    <nav class="header-right" aria-label="Hauptnavigation">
      <ul class="nav-list">
        <li>
          <a href="#about">{{ 'HEADER.LINKS.ABOUT' | translate }}</a>
        </li>
        <li>
          <a href="#skills">{{ 'HEADER.LINKS.SKILLS' | translate }}</a>
        </li>
        <li>
          <a href="#works">{{ 'HEADER.LINKS.WORKS' | translate }}</a>
        </li>
      </ul>
      <div class="lang-switch" aria-label="Sprachauswahl">
        <a href="#" [class.active]="is('de')" (click)="setLang($event, 'de')">DE</a>
        <span class="sep">/</span>
        <a href="#" [class.active]="is('en')" (click)="setLang($event, 'en')">EN</a>
      </div>
      <div class="burger-menu">
        <button
          class="burger-button"
          [attr.aria-label]="'HEADER.CLOSE_MENU' | translate"
          (click)="toggleOverlay()"
        >
          <img src="/icons/burger.png" [alt]="'HEADER.BURGER_ALT_CLOSE' | translate" />
        </button>
      </div>
    </nav>
  </div>
</header>
<div
  class="header-overlay"
  *ngIf="isOverlayOpen"
  (click)="closeOverlay()"
  role="dialog"
  aria-modal="true"
>
  <div class="overlay-inner" (click)="$event.stopPropagation()">
    <div class="overlay-top">
      <a class="logo" href="/">
        <img src="/icons/logo-blue.png" width="80" height="80" alt="Logo" />
      </a>
      <button
        class="overlay-close"
        [attr.aria-label]="'HEADER.BURGER.CLOSE' | translate"
        (click)="toggleOverlay()"
      >
        <img src="/icons/burger.png" [alt]="'HEADER.BURGER.CLOSE' | translate" />
      </button>
    </div>
    <nav class="overlay-nav" aria-label="Overlay Navigation">
      <a href="#about" (click)="closeOverlay()">{{ 'HEADER.LINKS.ABOUT' | translate }}</a>
      <a href="#skills" (click)="closeOverlay()">{{ 'HEADER.LINKS.SKILLS' | translate }}</a>
      <a href="#works" (click)="closeOverlay()">{{ 'HEADER.LINKS.WORKS' | translate }}</a>
      <div class="overlay-lang" aria-label="Sprachauswahl">
        <a href="#" [class.active]="is('de')" (click)="setLangAndClose($event, 'de')">DE</a>
        <span class="sep">/</span>
        <a href="#" [class.active]="is('en')" (click)="setLangAndClose($event, 'en')">EN</a>
      </div>
    </nav>
  </div>
</div>
